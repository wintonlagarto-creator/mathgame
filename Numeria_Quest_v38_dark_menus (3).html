<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#2b1a6e;--card:#fff6e8;--ink:#3b2a5e;--pri:#7b5cff;--ok:#22c55e;--bad:#f87171;--gold:#fbbf24;--line:#fde68a;--shadow:0 10px 28px rgba(0,0,0,.22)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Nunito,"Noto Color Emoji",system-ui,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent;user-select:none}
h1,h2,h3,.big{font-family:"Fredoka","Noto Color Emoji",system-ui,sans-serif;margin:0;font-weight:800;text-shadow:0 1px 0 #fff,0 2px 0 #e9d5ff,0 3px 0 #d8b4fe,0 4px 0 #c084fc,0 5px 0 #a855f7,0 6px 1px rgba(0,0,0,.15),0 8px 6px rgba(0,0,0,.12)}

#ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding:10px 12px;z-index:20}
#ui>div{pointer-events:auto;width:100%;max-width:560px;margin:0 auto}
.sheet{background:rgba(255,246,232,.96);border:4px solid var(--line);border-radius:24px;padding:16px;max-height:40vh;overflow:auto;margin-bottom:6px;box-shadow:var(--shadow);animation:popIn .35s cubic-bezier(.2,.9,.3,1.2);backdrop-filter:blur(6px)}
.sheet.title{max-height:32vh;padding:8px 12px}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
.sheet.t{text-align:center}
.btn{font:800 1.3rem "Fredoka","Noto Color Emoji",system-ui;background:var(--pri);color:#fff;border:0;border-bottom:6px solid #4c2db0;border-radius:20px;padding:15px 26px;cursor:pointer;min-height:60px;transition:transform .08s;text-shadow:0 2px 0 #3b1a9e,0 3px 4px rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);border-bottom-width:2px}
.btn.alt{background:var(--card);color:var(--ink);border:4px solid var(--line);border-bottom-width:6px;text-shadow:none}
.btn.green{background:#22c55e;border-bottom-color:#15803d}

button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.hud{display:flex;gap:8px;align-items:center;justify-content:space-between;font:800 1.15rem "Fredoka","Noto Color Emoji";flex-wrap:wrap}
.pill{background:var(--card);border:3px solid var(--line);border-radius:99px;padding:6px 16px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 0 #fff inset;font-size:1.05em}
.emoji3d{display:inline-block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));text-shadow:0 2px 0 rgba(255,255,255,.5);transform:scale(1.15)}
.icon-bubble{display:inline-flex;align-items:center;justify-content:center;width:2.8em;height:2.8em;border-radius:50%;background:linear-gradient(145deg,#fffaf0,#ffe4b8);border:3px solid #fbbf24;box-shadow:0 5px 14px rgba(0,0,0,.2),inset 0 2px 4px #fff,inset 0 -2px 4px rgba(251,191,36,.3);font-size:1.55rem;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.bar{height:18px;background:var(--line);border-radius:12px;overflow:hidden;margin:8px 0;border:3px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);transition:width .4s cubic-bezier(.2,.8,.3,1);box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.q{font:800 3.3rem/1.1 "Fredoka","Noto Color Emoji";text-align:center;margin:6px 0 14px;letter-spacing:-1px;color:#5b21b6;text-shadow:0 1px 0 #fff,0 2px 0 #e9d5ff,0 3px 0 #d8b4fe,0 4px 0 #c084fc,0 5px 0 #a855f7,0 6px 2px rgba(0,0,0,.18)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid.easy3{grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid.easy3 .ans{font-size:2.1rem;min-height:72px;padding:14px 8px}
.ans{font:800 2.4rem "Fredoka","Noto Color Emoji";padding:20px 14px;border-radius:22px;border:4px solid var(--line);border-bottom-width:8px;background:linear-gradient(180deg,#fffef8,#fff5e0);color:var(--ink);cursor:pointer;min-height:84px;transition:transform .1s,background .15s,box-shadow .15s;text-shadow:0 1px 0 #fff,0 2px 0 #fde68a,0 3px 0 #fbbf24,0 4px 2px rgba(0,0,0,.12);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.ans:active{transform:scale(.94)}
.ans.ok{background:linear-gradient(180deg,#4ade80,#22c55e);color:#fff;box-shadow:0 0 0 7px rgba(34,197,94,.45);text-shadow:0 2px 0 #15803d;transform:scale(1.08);animation:popOk .35s ease}
.ans.no{background:linear-gradient(180deg,#fca5a5,#f87171);color:#fff;box-shadow:0 0 0 6px rgba(248,113,113,.4);text-shadow:none;animation:shakeNo .4s ease}
.ans.almost{background:linear-gradient(180deg,#fde68a,#fbbf24);color:#5b21b6;box-shadow:0 0 0 6px rgba(251,191,36,.45);animation:popOk .3s ease}

.hint{font-size:1.45rem;line-height:1.55;text-align:center;word-break:break-word;margin:12px 0;color:#6b21a8;min-height:2.4em}
.hint.visual{font-size:1.6rem;letter-spacing:1px}
.active-buff{box-shadow:0 0 0 3px #22c55e,0 0 12px rgba(34,197,94,.5)!important;animation:pulseBuff 1.2s infinite}
@keyframes pulseBuff{0%,100%{box-shadow:0 0 0 3px #22c55e,0 0 8px rgba(34,197,94,.4)}50%{box-shadow:0 0 0 5px #22c55e,0 0 16px rgba(34,197,94,.6)}}
.streak-pill{background:linear-gradient(90deg,#fbbf24,#f59e0b)!important;color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.3);border-color:#d97706!important}
.say{display:flex;gap:14px;align-items:flex-start}.say .face{font-size:3.2rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));text-shadow:0 2px 0 rgba(255,255,255,.4);line-height:1}.say p{margin:0;font-size:1.25rem;line-height:1.5}
.node{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px 18px;margin-top:12px;border-radius:22px;border:4px solid var(--line);border-bottom-width:7px;background:linear-gradient(180deg,#fffef8,#fff5e0);color:var(--ink);cursor:pointer;font:inherit;transition:transform .1s;min-height:80px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.node:active:not(:disabled){transform:scale(.97)}.node:disabled{opacity:.4;cursor:not-allowed}.node .em{font-size:2.9rem;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3));text-shadow:0 2px 0 rgba(255,255,255,.35)}
.title .big{font-size:3.1rem;line-height:1;color:#5b21b6;text-shadow:0 1px 0 #fff,0 2px 0 #fce7f3,0 3px 0 #f9a8d4,0 4px 0 #f472b6,0 5px 0 #ec4899,0 6px 0 #db2777,0 8px 3px rgba(0,0,0,.2)}
.ans.hero{font:800 .85rem "Fredoka","Noto Color Emoji";min-height:0;padding:10px 6px;width:72px;border-bottom-width:5px;background:linear-gradient(180deg,#fffef8,#ffe8c8);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.ans.hero i{display:block;width:32px;height:32px;border-radius:50%;margin:0 auto 4px;border:3px solid var(--ink);box-shadow:0 3px 6px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.4)}
.ans.hero.locked{opacity:.45;filter:grayscale(.8)}
.ans.hero img.hthumb{display:block;width:46px;height:46px;margin:0 auto 1px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.ans.hero .pet-icon{font-size:1.8rem;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));line-height:1.1;margin-bottom:2px}
.sheet.map{max-height:54vh}
.lvl{display:block;width:100%;padding:0;margin-top:12px;border:4px solid var(--line);border-bottom-width:7px;border-radius:22px;overflow:hidden;background:#fffaf0;cursor:pointer;text-align:left;font:inherit;color:var(--ink);box-shadow:0 6px 14px rgba(0,0,0,.14);transition:transform .1s}
.lvl:active:not(:disabled){transform:scale(.97)}.lvl:disabled{cursor:not-allowed}
.lvl .art{position:relative;height:96px}.lvl .art svg{width:100%;height:100%;display:block}
.lvl.locked .art svg{filter:grayscale(1) brightness(.6)}
.lvl .opb{position:absolute;left:10px;top:8px;width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#fffaf0,#ffe4b8);border:3px solid #fbbf24;font:800 1.7rem/36px "Fredoka","Noto Color Emoji";text-align:center;color:#5b21b6;box-shadow:0 4px 8px rgba(0,0,0,.25)}
.lvl .tag{position:absolute;right:10px;top:10px;font:800 .85rem "Fredoka","Noto Color Emoji";background:#22c55e;color:#fff;border-radius:99px;padding:3px 12px;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.lvl .tag.next{background:#7b5cff}
.lvl .lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 .95rem "Fredoka","Noto Color Emoji";color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);gap:2px}.lvl .lock b{font-size:2rem;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.lvl .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px 9px;background:linear-gradient(180deg,#fffef8,#fff1d6)}
.lvl .nm{font:800 1.3rem "Fredoka","Noto Color Emoji";line-height:1.1;color:#5b21b6}.lvl .boss{font-size:.95rem}.lvl .boss .foe{font-size:1.15rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.lvl .st{font-size:1.35rem;white-space:nowrap;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.bar i.ld{background:repeating-linear-gradient(45deg,#fbbf24 0 10px,#f59e0b 10px 20px);background-size:28px 28px;animation:shim .6s linear infinite}
@keyframes shim{to{background-position:28px 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gems{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}.gems span{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#eadfc8;border:3px solid var(--line);font-size:1.25rem;filter:grayscale(1) opacity(.45);transition:all .3s}.gems span.on{filter:none;transform:scale(1.18);background:#fff;box-shadow:0 0 14px rgba(251,191,36,.9)}
#fxlayer{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.float{position:absolute;font:800 1.7rem "Fredoka","Noto Color Emoji";color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.5);animation:floatUp 1s ease-out forwards;white-space:nowrap}
.float.gold{color:#fbbf24;font-size:2rem}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1.3)}}
.combo{position:fixed;top:24%;left:50%;transform:translateX(-50%);font:800 2.4rem "Fredoka","Noto Color Emoji";color:#fbbf24;text-shadow:0 1px 0 #fff,0 2px 0 #fde68a,0 3px 0 #fbbf24,0 4px 0 #f59e0b,0 5px 0 #d97706,0 6px 0 #5b21b6,0 8px 4px rgba(0,0,0,.3);pointer-events:none;z-index:30;opacity:0}
.confetti{position:absolute;width:10px;height:10px;border-radius:2px;animation:conf 1.2s ease-out forwards}
@keyframes conf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(120px) rotate(400deg);opacity:0}}
#toast{position:fixed;bottom:18%;left:50%;transform:translateX(-50%);background:rgba(43,26,110,.92);color:#fff;font:800 1.05rem "Fredoka","Noto Color Emoji";padding:12px 18px;border-radius:20px;opacity:0;transition:opacity .3s;z-index:40;pointer-events:none;white-space:normal;text-align:center;line-height:1.35;max-width:88vw;width:max-content}

#flash{position:fixed;inset:0;pointer-events:none;z-index:28;opacity:0;transition:opacity .15s}
#pipBubble{position:fixed;top:12%;left:50%;transform:translateX(-50%);background:rgba(255,246,232,.95);border:3px solid var(--line);border-radius:18px;padding:8px 16px;font:800 1.15rem "Fredoka","Noto Color Emoji";color:var(--ink);opacity:0;transition:opacity .25s;z-index:32;pointer-events:none;max-width:80%;text-align:center;box-shadow:var(--shadow)}
.sheet .xbtn{position:absolute;top:8px;right:10px;width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:#fff;color:var(--ink);font:800 1.1rem "Fredoka","Noto Color Emoji",system-ui;cursor:pointer;line-height:1;padding:0;z-index:2;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.sheet.min{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;padding:0;overflow:visible;animation:none}

.sheet.min .xbtn{position:static;display:block;margin:0 auto;width:auto;height:auto;padding:12px 28px;border-radius:99px;background:var(--pri);color:#fff;border:3px solid #4c2db0;border-bottom-width:6px;font-size:1.25rem;text-shadow:0 2px 0 #3b1a9e}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.lbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);font:800 1.4rem "Fredoka","Noto Color Emoji",system-ui;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);padding:4px;line-height:1.1}
.lbtn span{font-size:.7rem;font-weight:700}
.lbtn.boss{background:linear-gradient(#ffe066,#ffc078);border-color:#e8590c}

.lart svg{width:100%;height:100%;display:block}
.i3d{width:1.25em;height:1.25em;vertical-align:-.3em;display:inline-block;object-fit:contain;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(40,20,90,.35));animation:i3f 3.2s ease-in-out infinite;will-change:transform}

body.gfx-ultra::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 58%,rgba(24,8,56,.34))}

/* ---- Polish pass ---- */
html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,.big{font-weight:700;letter-spacing:.2px;text-shadow:0 2px 0 rgba(255,255,255,.75),0 4px 10px rgba(91,33,182,.22)}
.q{font-weight:700;letter-spacing:0;color:#4c1d95;text-shadow:0 2px 0 #fff,0 5px 10px rgba(91,33,182,.22)}
.ans{font-weight:700;text-shadow:none;background:linear-gradient(180deg,#fff,#fff3da);transition:transform .12s,box-shadow .15s,background .15s}
.ans:hover{transform:translateY(-2px);box-shadow:0 8px 0 rgba(0,0,0,.08),0 10px 18px rgba(91,33,182,.18)}
.ans.ok{text-shadow:0 2px 0 rgba(21,128,61,.7)}
.btn,.btn.pink,.boy .btn.pink,.btn.green{font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.alt{text-shadow:none}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:translateY(4px)}
.ltr{text-shadow:0 3px 0 var(--c),0 7px 12px rgba(0,0,0,.25)}
.combo{text-shadow:0 2px 0 #b45309,0 4px 0 #5b21b6,0 8px 12px rgba(0,0,0,.35)}
.pill,.pxstat,.pxname{font-weight:700}
.i3d{animation:none;width:1.3em;height:1.3em;filter:drop-shadow(0 2px 2px rgba(40,20,90,.32))}
.emoji3d{transform:none}
.sheet{border-radius:28px;background:rgba(255,248,236,.97)}
.lbtn span,.dbc small,.gl,.dba,.dbb span{font-size:max(.78rem,1em)}
.xpbar span{font-size:.72rem}.hcol{font-size:.72rem}.lvs,.lbn small,.dbh .nm small{font-size:.82rem}
.sheet::-webkit-scrollbar{width:8px}.sheet::-webkit-scrollbar-thumb{background:#e9c9ff;border-radius:8px}
button{touch-action:manipulation}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== v2: bigger + smoother icons ===== */
.i3d{width:1.45em;height:1.45em;vertical-align:-.35em;image-rendering:auto;will-change:auto;transform:translateZ(0);backface-visibility:hidden;filter:drop-shadow(0 2px 2px rgba(40,20,90,.28))}
.sidecol{width:78px;gap:6px;top:clamp(96px,14vh,116px)}
.sidecol .tile{min-height:62px;font-size:.74rem;padding:4px 2px;border-radius:18px}
.sidecol .tile b{font-size:1.8rem}
.sidecol .tile .i3d{width:2.05rem;height:2.05rem;vertical-align:0}
.tile b .i3d{width:1.5em;height:1.5em;vertical-align:0}
.tile,.btn,.pill,.closeX,.sidecol .tile{transition:transform .14s cubic-bezier(.2,.9,.3,1.2),box-shadow .14s,filter .14s,background .2s}
.tile:hover,.pill:hover{transform:translateY(-2px) scale(1.04)}
.pill .i3d,.hud .i3d,.minihud .i3d{width:1.5em;height:1.5em;vertical-align:-.4em}
.pill{padding:5px 14px}
.icon-bubble .i3d{width:1.6em;height:1.6em}
.menuIc{font-size:1.5rem!important;min-width:48px}
/* smoother: blur over a live WebGL canvas is very expensive */
.sheet{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(255,248,236,.98);will-change:transform,opacity}
#ui{contain:layout style}
@media (max-width:640px){.sidecol{width:68px}.sidecol .tile{min-height:56px}.sidecol .tile b{font-size:1.6rem}.sidecol .tile .i3d{width:1.8rem;height:1.8rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v2: rotate / spin / settings buttons ===== */
.minihud .pill.btn[aria-label="Spin left"],.minihud .pill.btn[aria-label="Spin right"],.minihud .pill.btn[aria-label="Toggle spin"],.minihud .pill.btn[aria-label="Settings"]{
  width:46px;height:46px;min-width:46px;min-height:46px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 25%,#fff 0%,#fff6e8 55%,#ffe7b0 100%);border:3px solid var(--line);border-bottom-width:5px;
  box-shadow:0 4px 10px rgba(60,20,110,.28),inset 0 2px 3px #fff;font-size:1rem;overflow:visible}
.minihud .pill.btn[aria-label="Spin left"] .i3d,.minihud .pill.btn[aria-label="Spin right"] .i3d,.minihud .pill.btn[aria-label="Toggle spin"] .i3d,.minihud .pill.btn[aria-label="Settings"] .i3d{
  width:30px;height:30px;vertical-align:0;transition:transform .45s cubic-bezier(.2,.9,.3,1.4);filter:drop-shadow(0 3px 3px rgba(40,20,90,.35))}
.minihud .pill.btn[aria-label="Spin left"]:hover .i3d{transform:rotate(-70deg) scale(1.1)}
.minihud .pill.btn[aria-label="Spin right"]:hover .i3d{transform:rotate(70deg) scale(1.1)}
.minihud .pill.btn[aria-label="Settings"]:hover .i3d{transform:rotate(90deg) scale(1.1)}
.minihud .pill.btn[aria-label="Toggle spin"]:hover .i3d{transform:rotate(180deg) scale(1.1)}
.minihud .pill.btn[aria-label="Spin left"]:active .i3d{transform:rotate(-140deg)}
.minihud .pill.btn[aria-label="Spin right"]:active .i3d{transform:rotate(140deg)}
.minihud .pill.btn[aria-label="Toggle spin"].on{background:radial-gradient(circle at 32% 25%,#fff 0%,#dff3ff 55%,#a9dcff 100%);border-color:#6cc3ff}

function addCoins(n){if(!n)return;S.coins=(S.coins||0)+n;if(n>0)try{hist().coins+=n}catch(e){}save();floatText(innerWidth*.5,innerHeight*.3,"🪙 +"+n,"gold")}

function care(){S.care=S.care||{};const k=S.pet||"Pip",now=Date.now();let c=S.care[k];if(!c)c=S.care[k]={h:70,f:70,c:70,ts:now};

const mood=()=>{const c=care();return Math.round((c.h+c.f+c.c)/3)};
const moodIc=m=>m>=75?"😄":m>=50?"🙂":m>=25?"😐":"😢";

  const nm=(PETS[S.pet]||PETS.Pip).name;
  ui(`<div class="hud"><span class="pill">🏠 ${nm} ${moodIc(m)}</span>${coinPill()}${vo()}</div>`,
  `<div class="sheet"><p style="margin:0 0 4px;text-align:center;font-size:1rem">${m>=70?T("Happy pet = +1 bonus XP on every right answer!","Masayang pet = +1 bonus XP sa bawat tamang sagot!"):T("Keep your pet happy (70+) for bonus XP!","Pasayahin ang pet (70+) para sa bonus XP!")}</p>
  ${bar("🍎",c.h,"#ff922b")}${bar("🎾",c.f,"#51cf66")}${bar("🛁",c.c,"#4dabf7")}
  <div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px">

  <button class="btn alt" style="padding:8px 12px;font-size:1rem" onclick="petAct('treat')">🍰 ${T("Treat","Treat")} 🪙5</button>
  <button class="btn alt" style="padding:8px 12px;font-size:1rem" onclick="petAct('play')">🎾 ${T("Play","Laro")}</button>

function petAct(a){const c=care(),cost={feed:2,treat:5,play:0,wash:1}[a];
  if((S.coins||0)<cost){toast(T("Not enough coins! Win levels or play mini-games 🪙","Kulang ang coins! Manalo sa levels o maglaro ng mini-games 🪙"));return}
  if(a==="play"&&c.f>=98){pipSay(T("I'm tired of playing!","Pagod na ako maglaro!"));return}
  if((a==="feed"||a==="treat")&&c.h>=98){pipSay(T("I'm full!","Busog na ako!"));return}
  if(a==="wash"&&c.c>=98){pipSay(T("I'm already clean!","Malinis na ako!"));return}
  S.coins=(S.coins||0)-cost;
  if(a==="feed"){c.h=Math.min(100,c.h+30);pipSay(T("Yum yum! 🍎","Sarap! 🍎"));floatText(innerWidth*.5,innerHeight*.35,"🍎 yum!","gold")}
  else if(a==="treat"){c.h=Math.min(100,c.h+40);c.f=Math.min(100,c.f+20);pipSay(T("Yummy treat! 🍰","Sarap na treat! 🍰"));floatText(innerWidth*.5,innerHeight*.35,"🍰 yay!","gold")}
  else if(a==="play"){c.f=Math.min(100,c.f+25);c.h=Math.max(0,c.h-4);pipSay(T("Wheee! 🎾","Wheee! 🎾"));floatText(innerWidth*.5,innerHeight*.35,"🎾 wheee!","gold")}
  else{c.c=Math.min(100,c.c+40);pipSay(T("So fresh! 🛁","Ang bango! 🛁"));if(PP)burst(PP.position.clone().setY(1.2),0xffffff,34)}
  c.ts=Date.now();save();beep(660,.1);setTimeout(()=>beep(880,.12),90);
  if(PP&&!S.reduceMotion){const u=PP.userData,y0=u.y;tw(.5,p=>{u.y=y0+Math.sin(p*Math.PI)*1.1})}
  floatText(innerWidth*.5,innerHeight*.28,"💖","gold");renderPet()}

function showTutorial(){hub();

    "Tap the correct number to help your hero attack!",
    "Need help? Tap the Hint button. Mistakes are okay!",

    $("#nx").onclick=()=>{if(i<steps.length-1){i++;show()}else{S.seenTut=true;save();done()}};
    $("#nx").focus();

  const done=()=>{speak(T("Great job! You finished the tutorial!","Ang galing! Tapos mo na ang tutorial!"));

    $("#tgo").focus()};
  show();
}

  `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;margin:0 0 8px"><button class="btn alt" style="padding:10px 16px;font-size:1.05rem;min-height:0" onclick="showTitle()">Menu</button><button class="btn alt" style="padding:10px 16px;font-size:1.05rem;min-height:0" onclick="showPractice()">🎯 Practice</button><button class="btn alt" style="padding:10px 16px;font-size:1.05rem;min-height:0" onclick="showDaily()">📅 Daily</button><button class="btn alt" style="padding:10px 16px;font-size:1.05rem;min-height:0" onclick="showAdventure()">🧭 Adventure</button><button class="btn alt" style="padding:10px 16px;font-size:1.05rem;min-height:0" onclick="showGames()">🎮 Games</button></div><div class="sheet map"><div class="say"><div class="face">${FOX()}</div><p>${S.shards.length<5?`Where next? You have ${stars()}/15 stars`:"You collected all the shards! 🌈"}</p></div>
  ${R.map((r,i)=>{const open=i===0||done(i-1),cur=open&&!done(i),n=S.stars[i]||0;return`<button class="lvl ${open?"":"locked"}" ${open?"":"disabled"} onclick="showLevels(${i})"><div class="art">${areaArt(i)}<span class="opb">${OPSYM[r.op]||r.op}</span>${done(i)?`<span class="tag">✓ ${T("Cleared","Tapos")}</span>`:cur?`<span class="tag next">${T("Play!","Laro!")}</span>`:""}${open?"":`<div class="lock"><b>🔒</b>${T("Finish the previous area","Tapusin muna ang nauna")}</div>`}</div><div class="meta"><div><div class="nm">${r.e} ${r.n}</div><div class="boss">${open?T("Boss: ","Boss: ")+`<span class="foe">${r.foe}</span> ${r.fn}`:T("Boss: ???","Boss: ???")}</div>${open?`<div class="boss" style="opacity:.8">${T("Levels","Antas")}: ${lvCount(i)}/${LVN}</div>`:""}</div><div class="st">${"⭐".repeat(n)}${"☆".repeat(3-n)}</div></div></button>`}).join("")}
</div>`)}


function showPauseMenu(resumeFn, quitMapFn, quitTitleFn){
  const prevBot = $("#bot").innerHTML;
  const prevTop = $("#top").innerHTML;
  ui(`<div class="hud"><span class="pill">⏸️ Paused</span>${vo()}</div>`,
  `<div class="sheet t bigm"><div class="big" style="font-size:2.4rem">⏸️ ${T("Paused","Naka-pause")}</div>
  <p style="margin:12px 0 16px;font-size:1.2rem">${T("What do you want to do?","Ano ang gusto mong gawin?")}</p>
  <button class="btn" id="pr">▶️ ${T("Resume","Ituloy")}</button>
  <button class="btn alt" id="pm">🗺️ ${T("Back to Map","Bumalik sa Mapa")}</button>
  <button class="btn alt" id="pt">🏠 ${T("Title Screen","Title Screen")}</button>
  </div>`);
  $("#pr").onclick=()=>{ui(prevTop, prevBot); if(resumeFn)resumeFn()};
  $("#pm").onclick=()=>{if(quitMapFn)quitMapFn(); else showMap()};
  $("#pt").onclick=()=>{if(quitTitleFn)quitTitleFn(); else showTitle()};
}

  const doSpecial=async()=>{

  reset(i){const n=(window._psN||[])[i];if(!n||!rbCan("delete","class")||!confirm(TT("Reset security for "+n+"? They must add a new password, PIN, Gmail and phone themselves.","I-reset ang security ni "+n+"? Sila mismo ang maglalagay ng bago.")))return;
    try{const d=JSON.parse(LS.get(ukey(n))||"{}");delete d.psec;delete d.psecSkip;LS.set(ukey(n),JSON.stringify(d))}catch(e){}
    rbLog("tbl_accounts","EDIT","reset security for "+n);toast("🔓 "+n,1800);showPlayers()},
  adel(i){const n=(window._psN||[])[i];if(!n||!rbCan("delete","class")||!confirm(TT("Delete the account of "+n+" and all their progress?","Burahin ang account ni "+n+" at lahat ng progreso?")))return;
    LS.del(ukey(n));LS.set("numeria_profiles",JSON.stringify(plist().filter(x=>x.toLowerCase()!==n.toLowerCase())));
    rbLog("tbl_players","DELETE","deleted account "+n);toast("🗑️ "+n,1800);showPlayers()}};
}catch(e){console.warn("Player security failed to start",e)}})();
</script>
